<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ chapter.title }} — Slides</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --r-background-color: #ffffff;
      --r-main-font: 'Inter', system-ui, sans-serif;
      --r-heading-font: 'Inter', system-ui, sans-serif;
      --r-heading-color: #312e81;
      --r-heading-font-weight: 700;
      --r-link-color: #6366f1;
      --r-link-color-hover: #4338ca;
      --r-selection-background-color: #c7d2fe;
      --r-main-font-size: 28px;
      --r-code-font: 'JetBrains Mono', monospace;
    }

    .reveal .slides section {
      text-align: left;
      overflow-y: auto;
      max-height: 85vh;
      padding: 0 0.5em;
    }

    .reveal h1, .reveal h2 {
      text-transform: none;
      letter-spacing: -0.02em;
    }

    .reveal h2 { font-size: 1.5em; margin-bottom: 0.6em; }
    .reveal h3 { font-size: 1.15em; color: #4f46e5; margin: 0.8em 0 0.3em; }

    .reveal p { line-height: 1.6; margin-bottom: 0.6em; font-size: 0.8em; }
    .reveal li  { font-size: 0.78em; line-height: 1.55; }
    .reveal ul, .reveal ol { margin-left: 1.2em; }

    .reveal pre {
      font-size: 0.6em;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      margin: 0.6em 0;
    }

    .reveal code:not(pre code) {
      background: #eef2ff;
      color: #4338ca;
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.82em;
    }

    .reveal blockquote {
      border-left: 3px solid #6366f1;
      background: #f5f3ff;
      color: #3730a3;
      padding: 0.5em 1em;
      border-radius: 0 6px 6px 0;
      font-style: normal;
      font-size: 0.78em;
      width: 95%;
    }

    .reveal table {
      font-size: 0.7em;
      border-collapse: collapse;
      width: 100%;
    }
    .reveal table th {
      background: #eef2ff;
      color: #312e81;
      padding: 0.4em 0.8em;
    }
    .reveal table td { padding: 0.35em 0.8em; border-bottom: 1px solid #e5e7eb; }

    /* Callout styles */
    .reveal .callout {
      border-radius: 6px;
      padding: 0.6em 1em;
      margin: 0.6em 0;
      font-size: 0.72em;
    }
    .reveal .callout-tip  { background: #fefce8; border-left: 3px solid #eab308; }
    .reveal .callout-try  { background: #eff6ff; border-left: 3px solid #3b82f6; }
    .reveal .callout-warn { background: #fff7ed; border-left: 3px solid #f97316; }
    .reveal .callout-note { background: #f0fdf4; border-left: 3px solid #22c55e; }
    .reveal .callout-label {
      font-weight: 700;
      font-size: 0.85em;
      display: block;
      margin-bottom: 0.3em;
    }
    .reveal .callout p { margin: 0; font-size: 1em; }

    /* Title slide */
    .title-slide { text-align: center !important; }
    .title-slide .chapter-num {
      font-size: 0.6em;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #6366f1;
      margin-bottom: 0.5em;
    }
    .title-slide h2 {
      font-size: 1.8em;
      color: #1e1b4b;
      margin-bottom: 0.4em;
    }
    .title-slide .desc {
      font-size: 0.7em;
      color: #6b7280;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .title-slide .meta {
      font-size: 0.6em;
      color: #9ca3af;
      margin-top: 1.5em;
    }

    /* Back button */
    .back-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: #f5f3ff;
      color: #4f46e5;
      border: 1px solid #c7d2fe;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .back-btn:hover { background: #ede9fe; }

    /* Slide count badge */
    .reveal .slide-number {
      background: transparent;
      color: #9ca3af;
      font-size: 11px;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Chapter</a>

  <div class="reveal">
    <div class="slides">

      <!-- Title slide -->
      <section class="title-slide">
        <div class="chapter-num">Chapter {{ '%02d' % chapter_index }} · Claude Code Tutorial</div>
        <h2>{{ chapter.title }}</h2>
        <p class="desc">{{ chapter.desc }}</p>
        <p class="meta">{{ chapter.time }} · {{ slides | length }} sections</p>
      </section>

      <!-- Content slides -->
      {% for slide in slides %}
      <section>
        <h2>{{ slide.title }}</h2>
        {{ slide.html | safe }}
      </section>
      {% endfor %}

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>

  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      progress: true,
      transition: 'slide',
      transitionSpeed: 'fast',
      center: false,
      plugins: [RevealHighlight, RevealNotes],
    });
  </script>
</body>
</html>
